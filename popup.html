<!DOCTYPE html>
<html>
<head>
  <title>Youtube Speed Saver</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <h3>Playback Speed</h3>

  <div id="speed-display">
    <button id="decreaseBtn" class="control-btn">-</button>
    <div id="speedValue">1.00x</div>
    <button id="increaseBtn" class="control-btn">+</button>
  </div>

  <input type="range" id="speedSlider" min="0.25" max="4.0" step="0.05" value="1.0">

  <div id="preset-buttons">
    <button class="preset-btn" data-speed="0.75">0.75x</button>
    <button class="preset-btn" data-speed="1.0">1.0x</button>
    <button class="preset-btn" data-speed="1.25">1.25x</button>
    <button class="preset-btn" data-speed="1.5">1.5x</button>
    <button class="preset-btn" data-speed="1.75">1.75x</button>
    <button class="preset-btn" data-speed="2.0">2.0x</button>
    <button class="preset-btn" data-speed="2.25">2.25x</button>
    <button class="preset-btn" data-speed="2.5">2.5x</button>
    <button class="preset-btn" data-speed="2.75">2.75x</button>
  </div>

  <div id="footer">
    <p>Feedback & Support: <a href="mailto:krwd1117@gmail.com">krwd1117@gmail.com</a></p>
    <p><a href="https://github.com/krwd1117" target="_blank">GitHub Profile</a></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
